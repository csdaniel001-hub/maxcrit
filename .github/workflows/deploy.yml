# Builds the site and uploads _site/ to the web host over FTP on every push to main.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.maxcrit.com
#   FTP_USERNAME  the FTP account name from cPanel
#   FTP_PASSWORD  that account's password
# Optional: FTP_SERVER_DIR (defaults to public_html/ ; leave it out if the FTP account opens straight into the web root,
# then set it to ./ ).
name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx @11ty/eleventy

      - name: Check
        run: node lib/check.js

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
