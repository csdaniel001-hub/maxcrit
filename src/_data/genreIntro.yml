# Short intro shown under each genre listing. Plain text, one or two paragraphs.
rpg: |
  Mobile RPGs move on a version schedule: a new region or story chapter, new characters, and limited banners. Our RPG coverage follows Genshin Impact, Honkai: Star Rail, Wuthering Waves, Zenless Zone Zero, Solo Leveling:Arise, Epic Seven, Reverse: 1999, CookieRun: Kingdom and AFK Journey.

  Each version story lists the dates, the characters and weapons on the banners, and the free rewards, so you can decide where to spend pulls before the phase starts. Redeem codes and banner schedules for the same games sit in the Player Hub.
mmorpg: |
  MMORPGs on mobile share servers, economies and often accounts with their PC versions, so one patch can change your gear, your market prices and where your guild spends the week. We cover Albion Online, Black Desert Mobile, Diablo Immortal, Old School RuneScape, Toram Online and Tree of Savior M.

  Expect expansion and patch breakdowns, account and login changes, seasonal servers, and launch or pre-registration dates for new MMOs, each with the official notes linked.
shooter: |
  Shooter updates arrive as seasons: a new map or mode, a battle pass, weapon balance and ranked resets. We follow PUBG MOBILE, Call of Duty: Mobile, Delta Force, Arena Breakout, Brawl Stars and NIKKE.

  Patch stories lead with the weapon and mode changes that affect your loadout, then the season dates and pass rewards. Full patch-note trackers for the biggest shooters live in the Player Hub.
strategy: |
  Strategy games on mobile reward planning weeks ahead: upgrade timers, troop and card balance, and events that hand out the resources you need for the next Town Hall or kingdom stage. We cover Clash of Clans, Clash Royale, Boom Beach, Rise of Kingdoms, Kingshot, Teamfight Tactics and Girls' Frontline 2: Exilium.

  Balance changes are listed unit by unit, and event stories give the dates and rewards so you can line up builders and boosts in advance.
moba: |
  MOBA patches shift which heroes and items work, sometimes within a week. We cover League of Legends: Wild Rift, Pokémon UNITE, Honor of Kings and Mobile Legends: Bang Bang.

  Each patch story lists the buffs, nerfs and item changes with the numbers from the official notes, followed by new heroes, revamps and the events running alongside them.
action: |
  This section groups action games that play very differently: location-based AR like Pokémon GO and Monster Hunter Now, character action like Punishing: Gray Raven and Honkai Impact 3rd, roguelites like Survivor!.io, plus Infinity Nikki, Marvel Contest of Champions and DRAGON BALL LEGENDS.

  For the AR games we track Community Days, raid days and paid event tickets with dates and local times. For the rest, version updates, new characters and limited events.
sports: |
  Sports games on mobile follow the real calendar: new seasons, roster updates, holiday events and in-game reward tracks tied to real leagues. We cover EA SPORTS FC Mobile, eFootball, NBA 2K Mobile, Madden NFL 27 Mobile and Top Eleven.

  Stories give event dates, reward tracks and rule changes, plus account and store issues when a publisher announces them.
racing: |
  Racing updates add cars, seasons and time-limited events, and the event rules decide which cars are worth upgrading. We cover Asphalt Legends and Hill Climb Racing 2.

  Each story lists the new cars or vehicles, the event dates and what you need to enter, taken from the publisher's own announcements.
cards: |
  Card games live on new sets and balance passes: one change to a key card can break or revive a whole deck. We cover MARVEL SNAP, Chaos Zero Nightmare and UNO!.

  Patch stories list every card change with the old and new values, and season stories cover the new cards, locations and how to get them.
simulation: |
  Simulation and management games run on seasonal content: holiday collections, new buildings, timed quests and limited decorations. We cover Township, The Sims FreePlay and Petit Planet.

  Stories give the start and end dates and what each event unlocks, so you can plan production and timers around them.
puzzle: |
  Puzzle games add levels every week or two, along with new areas, events and boosters. We cover Royal Match, Candy Crush Saga, Homescapes and Gardenscapes.

  Updates are listed with the number of new levels, the areas or rooms they open and the events running at the same time.
arcade: |
  Arcade games keep runs short and update through seasons and collaborations: a new city or world tour, limited characters and boards, and party-game modes. We cover Subway Surfers and Stumble Guys.

  Season stories give the dates, the new characters and items, and the modes added in each update.
